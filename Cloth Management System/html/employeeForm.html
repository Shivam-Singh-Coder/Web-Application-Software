    <script>
        function medtype(){
       
            const select = document.getElementById('med-type').value;
            
            if(select == 'tablet'){
                document.getElementById('med-level').innerHTML = 'Number of Strip';
                document.getElementById('change').placeholder = 'Enter Number of Strip'
            }else{
                document.getElementById('med-level').innerHTML = 'Medicine Volume';
                document.getElementById('change').placeholder = 'Enter Medicine Volumn'
            }
         

           
        }


        const today = new Date();
            const day = String(today.getDate()).padStart(2, "0");
            const month = String(today.getMonth() + 1).padStart(2, "0"); 
            const year = today.getFullYear();
            const formattedDate = `${day}-${month}-${year}`;
            document.getElementById("formattedDate").textContent = formattedDate;
            $('#dob').attr('max',`${year}-${month}-${day}`);

    </script>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    
    <script>
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
      }
      $(document).ready(function(){
        const userId = getCookie('user_id');
        if (!userId){
          alert("You are not login, redirecting to login page.")
          window.location.href = "../index.html";
        }
        // Get auto-generated employee ID from backend
        $.ajax({
            method: 'POST',
            url: '../python/backend.py',
            data: {
                cond: 'get_emp_id'
            },
            success: function (response) {
                try {
                    if (typeof response === 'string') {
                        response = JSON.parse(response);
                    }

                    if (response.success) {
                        $("input[name='emp_id']").val(response.emp_id); // Set in input field
                    } else {
                        alert("Failed to fetch Employee ID: " + response.message);
                    }
                } catch (e) {
                    alert("Error parsing response: " + e);
                }
            },
            error: function (xhr, status, error) {
                alert("AJAX error: " + error);
            }
        });

        // Submit employeeForm
        $('#employeeForm').on('submit', function(e){
            e.preventDefault();
            const conf = confirm("Are you sure want to insert this record?");
            if(!conf){
                return;
            }
            $.ajax({
                method: 'POST',
                url: '../python/backend.py',
                data: {
                    cond: 'emp_entry',
                    emp_id: $("input[name='emp_id']").val() || null,
                    emp_name: $("input[name='emp_name']").val() || null,
                    emp_number: $("input[name='emp_number']").val() || null,
                    emp_email: $("input[name='emp_email']").val() || null,
                    emp_dob: $("input[name='emp_dob']").val() || null,
                    emp_gender: $("input[name='emp_gender']:checked").val() || null,
                    emp_address: $("input[name='emp_address']").val() || null,
                },
                success: function (response) {
                    try {
                        // Parse if needed (depends on server response headers)
                        if (typeof response === 'string') {
                            response = JSON.parse(response);
                        }

                        if (response.success) {
                            alert(response.message);
                            window.location.reload();
                        }
                        else {
                            alert(response.message);
                        }
                    }
                    catch (e) {
                        alert("Error parsing response: " + e);
                    }
                },
                error: function (xhr, status, error) {
                    alert("AJAX Error: " + error);
                }
            });
        });
      });
    </script>
