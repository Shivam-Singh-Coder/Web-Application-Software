                  </div>

            <div class="rightdiv">
                <div class="upper_div">
                    <p class="date_time">
                        Today's Date: <span id="formattedDate"></span>
                      </p>

                <div class="lower_div" >
                    <h2> Update Employee Details > </h2> <br>

                        <div class="item_entry" id="item_entry">

                            <h3> Update Form  </h3>
                            <table>
                                <tr>
                                    
                                    <td>
                                        <label for="">Employee Name</label> <br>
                                        <input id="med-name" type="text" class="form-control"data-validation="onlyalphabets" required placeholder="Enter Medicine Name " >
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>
                                    <td>
                                        <label for="">Employee Number</label> <br>
                                        <input id="med-compa" type="text" class="form-control"data-validation="onlynumbers" required placeholder="Enter Company Name" >
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>
    
                                    <td>
                                        <label for="" id="med-level"> Employee Email </label> <br>
                                        <input id="change" type="email" class="form-control email"   required placeholder="Enter Employee Email"> 
                                        <div class="invalid-feedback" style="color: red;"></div>   
                                    </td>

                                </tr>
                        
                                
                                
                                <tr> 
                                   
                                    
                                    <td>
                                        <label for="">Date Of Birth</label> <br>
                                        <input id="" type="date" required  >
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>
                                    <td>
                                        <label for="">Gender</label><br>
                                        <input id="" type="radio" name="g"> Male
                                        <input id="" type="radio" name="g"> Female
                                        <input id="" type="radio" name="g"> Other
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>

                                </tr>

                                <tr>
                                    <td colspan="2">
                                        <label for="" >Address</label> <br>
                                        <input type="text" placeholder="Enter Address " required style="width: 710px;">
                                        <div class="invalid-feedback" style="color: red;"></div>

                                    </td>
                                    <td>
                                        <div class="div-btn">
                                            <button  id="submit" style=" background-color: green; "> Update  </button>
                                            <button  id="reset" style="background-color: red; ">Reset</button>
                                           
                                   
                                        </div>   
                                    </td>
                                </tr>
                         
                               
                            </table>
                              
                            
                            <h2 id="save-msg" style="font-family: Arial, Helvetica, sans-serif; font-size: 20px; color: green; text-align: center; padding: 25px; position: relative; left: 410px; "></h2>
                        </div>
                     
                    
                        
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="../js/index.js"></script>
    <script>
        function medtype(){
       
            const select = document.getElementById('med-type').value;
            
            if(select == 'tablet'){
                document.getElementById('med-level').innerHTML = 'Number of Strip';
                document.getElementById('change').placeholder = 'Enter Number of Strip'
            }else{
                document.getElementById('med-level').innerHTML = 'Medicine Volume';
                document.getElementById('change').placeholder = 'Enter Medicine Volumn'
            }
         

           
        }


        const today = new Date();
            const day = String(today.getDate()).padStart(2, "0");
            const month = String(today.getMonth() + 1).padStart(2, "0"); 
            const year = today.getFullYear();
            const formattedDate = `${day}-${month}-${year}`;
            document.getElementById("formattedDate").textContent = formattedDate;

    </script>
</html>
