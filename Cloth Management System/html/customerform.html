<script>
    const today = new Date();
            const day = String(today.getDate()).padStart(2, "0");
            const month = String(today.getMonth() + 1).padStart(2, "0"); 
            const year = today.getFullYear();
            const formattedDate = `${day}-${month}-${year}`;
            document.getElementById("formattedDate").textContent = formattedDate;
            $('input[name="cust_dob"]').attr('max',`${year}-${month}-${day}`);
</script>
     <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
        $(document).ready(function () {
            const userId = getCookie('user_id');
            if (!userId){
            alert("You are not login, redirecting to login page.")
            window.location.href = "../index.html";
            }
            // Get auto-generated customer ID from backend
            $.ajax({
                method: 'POST',
                url: '../python/backend.py',
                data: {
                    cond: 'get_cust_id'
                },
                success: function (response) {
                    try {
                        if (typeof response === 'string') {
                            response = JSON.parse(response);
                        }

                        if (response.success) {
                            $("input[name='cust_id']").val(response.cust_id); // Set in input field
                        } else {
                            alert("Failed to fetch Customer ID: " + response.message);
                        }
                    } catch (e) {
                        alert("Error parsing response: " + e);
                    }
                },
                error: function (xhr, status, error) {
                    alert("AJAX error: " + error);
                }
            });

            // Submit customerForm
            $('#customerForm').on('submit', function(e){
                e.preventDefault();
                const conf = confirm("Are you sure want to insert this record?");
                if(!conf){
                    return;
                }
                $.ajax({
                    method: 'POST',
                    url: '../python/backend.py',
                    data: {
                        cond: 'cust_entry',
                        cust_id: $("input[name='cust_id']").val() || null,
                        cust_name: $("input[name='cust_name']").val() || null,
                        cust_number: $("input[name='cust_number']").val() || null,
                        cust_email: $("input[name='cust_email']").val() || null,
                        cust_dob: $("input[name='cust_dob']").val() || null,
                        cust_gender: $("input[name='cust_gender']:checked").val() || null,
                        cust_address: $("input[name='cust_address']").val() || null,
                    },
                    success: function (response) {
                        try {
                            // Parse if needed (depends on server response headers)
                            if (typeof response === 'string') {
                                response = JSON.parse(response);
                            }

                            if (response.success) {
                                alert(response.message);
                                window.location.reload();
                            }
                            else {
                                alert(response.message);
                            }
                        }
                        catch (e) {
                            alert("Error parsing response: " + e);
                        }
                    },
                    error: function (xhr, status, error) {
                        alert("AJAX Error: " + error);
                    }
                });
            });
        });

     </script>
