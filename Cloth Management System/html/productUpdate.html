            <div class="rightdiv">
                <div class="upper_div">
                    <p class="date_time">
                        Today's Date: <span id="formattedDate"></span>
                      </p>                 
                    
                </div>
                
                <div class="lower_div" >
                    <h2> Update Product Details></h2> <br>
                    <a href="product.html" class="service_btn"> <i class="fa-solid fa-arrow-left"></i> Service </a>  <br> <br>  <br>

                    
                    
                    

                        <div class="item_entry" id="item_entry">

                            <h3> Update Form  </h3>
                            <table>
                                <tr>
    
                                    <td>
                                        <label for="">Product ID</label> <br>
                                        <input type="text" placeholder=" Enter Product id " class="form-control"data-validation="" required >
                                        <div class="invalid-feedback" style="color: red;"></div>
    
                                    </td>
                                    <td>
                                        <label for="">Product Type </label> <br>
                                        <select name="" id="" class="form-select" required  >
                                            <option value="" selected disabled>--select Product Type-- </option>
                                            <option value="Dresses">Dresses</option>
                                            <option value="Tops">Tops</option>
                                            <option value="Jeans">Jeans</option>
                                            <option value="Jackets">Jackets</option>
                                            <option value="Shirts">Shirts</option>
                                        </select>
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>
                                    <td>
                                        <label for="">Product Name </label> <br>
                                        <select name="" id="" class="form-select" required >
                                            <option value="" selected disabled>--Select Product Name--</option>
                                            <option value="Floral Summer Maxi Dress">Floral Summer Maxi Dress</option>
                                            <option value="Classic Oxford Button-Down">Classic Oxford Button-Down</option>
                                            <option value="Slim Fit Chino Pants">Slim Fit Chino Pants</option>
                                            <option value="Dinosaur Print Tee">Dinosaur Print Tee</option>
                                            <option value="Cotton Drawstring Shorts">Cotton Drawstring Shorts</option>
                                            <option value="Kanchipuram Silk Saree">Kanchipuram Silk Saree</option>
                                        </select>
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>
    
                                </tr>
                                <tr>
                                    <td>
                                        <label for="">Product Quantity</label> <br>
                                        <input type="text" placeholder="Enter Quantity "  class="form-control"data-validation="onlynumbers" required>
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>
                                    <td>
                                        <label for="">Product Price</label> <br>
                                        <input type="text" id="" placeholder="Enter Price" class="form-control"data-validation="onlynumbers" required >
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>
                                   
                                    <td>
                                        <div class="div-btn">
                                            <button  id="submit" style=" background-color: green; "> Update  </button>
                                            <button  id="reset" style="background-color: red; ">Reset</button>
                                           
                                   
                                        </div>   
                                    </td>
                                </tr>

                                
                                
                            </table>
                              
                         
                            <h2 id="save_msg" style="font-family: Arial, Helvetica, sans-serif; font-size: 20px; color: green; text-align: center; padding: 25px; "></h2>
                        </div>
                     
                    
                        
                    </div>
                </div>
            </div>
        </div>
        <script src="../js/index.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>
    const today = new Date();
            const day = String(today.getDate()).padStart(2, "0");
            const month = String(today.getMonth() + 1).padStart(2, "0"); 
            const year = today.getFullYear();
            const formattedDate = `${day}-${month}-${year}`;
            document.getElementById("formattedDate").textContent = formattedDate;

    

    


    
</script>
