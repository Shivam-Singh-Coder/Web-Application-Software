<html>
    <head>
        <title>Cloth | Stock Details</title>
        <link rel="shortcut icon" href="../img/logo.ico" type="image/x-icon">
        <link rel="stylesheet" href="../css/addmedicine.css">
        <link rel="stylesheet" href="../css/sidemenu.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
            $(document).ready(function(){
            $("#user").click(function(){
            $("#profile").toggle();
            });
            });

            $(document).ready(function(){
            $("#reset-btn").click(function(){
            $("#med-idnames").val("")
            $("#med-mrp").val("")
            $("#med-quantity").val("")
            $("#med-expire").val("")
            $("#save-msg").text("")
            });
            });
            $(document).ready(function(){
            $("#submit-btn").click(function(){
            $("#save-msg").text("Add Stock Details Successfully")
            });
            });
            
          
        </script>
        
    </head>
    <body>
        <div class="div1">
            <div class="leftdiv">
                <div class="logodiv">
                    <img src="../img/logo.png" alt="">
                    <a href="dashboard.html">ClothStore</a>
                </div>
                <div class="vertical-menu">
                    <i class="fa-solid fa-house fa-xl" style="position: relative; top: 25px; left: 30px; color: #ffffff;"></i><a href="Dashboard.html" >Dashboard</a>
                    <i class="fa-solid fa-user fa-xl" style="position: relative; top: 30px; left: 30px; color: #ffffff;"></i><a href="employee.html">Employee Details</a>
                    <i class="fa-solid fa-users fa-xl" style="position: relative; top: 30px; left: 30px; color: #ffffff;"></i><a href="customer.html">Customer Details</a>
                    <i class="fa-solid fa-clipboard fa-xl" style="position: relative; top: 30px; left: 30px; color: #ffffff;"></i><a href="order_details.html">Order Details</a>
                    <i class="fa-solid fa-dumpster-fire fa-xl" style="position: relative; top: 30px; left: 30px; color: #ffffff;"></i><a href="product.html">Product Details</a>
                    <i class="fa-solid fa-box fa-xl" style="position: relative; top: 30px; left: 30px; color: #ffffff;"></i><a href="stock.html" class="active">Stock Details</a>
                    <i class="fa-solid fa-money-check fa-xl" style="position: relative; top: 30px; left: 30px; color: #ffffff;"></i><a href="employee_payment.html">Employe Payments</a>
                    <i class="fa-solid fa-credit-card fa-xl" style="position: relative; top: 30px; left: 30px; color: #ffffff;"></i><a href="customer_payment.html">Customer Payments</a>
                  </div>
            </div>

            <div class="rightdiv">
                <div class="upper_div">
                    <p class="date_time">
                        Today's Date: <span id="formattedDate"></span>
                      </p>                    
                   
                </div>
                
                <div class="lower_div" >
                    <h2> Stock Details > </h2> <br>
                    <a href="stock.html" class="service_btn"> <i class="fa-solid fa-arrow-left"></i> Service </a>  <br> <br>  <br>
                        <div class="item_entry" id="item_entry">

                            <h3>Stock Entry  </h3>
                            <table>
                                <tr>
                                    <td>
                                        <label for="">Product Id </label> <br>
                                        <select name="" id="" class="form-select" required  >
                                            <option value="" selected disabled>--select Product id-- </option>
                                           <option value="P001">P001</option>
                                           <option value="P002">P002</option>
                                           <option value="P003">P003</option>
                                        </select>
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>
                                    <td>
                                        <label for="">Sold Quantity</label> <br>
                                        <input id="" type="text" class="form-control"data-validation="onlynumbers" required placeholder="Enter Sold Quantity " >
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>
                                    <td>
                                        <label for=""> Remaining Quantity</label> <br>
                                        <input id="med-quantity" type="text" class="form-control"data-validation="onlynumbers" required placeholder="Enter Remaining Quantity" >
                                        <div class="invalid-feedback" style="color: red;"></div>
                                    </td>
    
                                   

                                </tr>
                        
                                
        
                         
                               
                            </table>
                            <div class="div-btn">
                                <button  id="submit-btn" style=" background-color: green; "> Submit  </button>
                                <button  id="reset-btn" style="background-color: red; ">Reset</button>
                            </div>    
                            
                            <h2 id="save-msg" style="font-family: Arial, Helvetica, sans-serif; font-size: 20px; color: green; text-align: center; padding: 25px; position: relative; left: 400px; "></h2>
                        </div>
                     
                    
                        
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="../js/index.js"></script>
    <script>
        const today = new Date();
            const day = String(today.getDate()).padStart(2, "0");
            const month = String(today.getMonth() + 1).padStart(2, "0"); 
            const year = today.getFullYear();
            const formattedDate = `${day}-${month}-${year}`;
            document.getElementById("formattedDate").textContent = formattedDate;

    </script>
</html>
